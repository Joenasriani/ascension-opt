name: Level 1 click-path probe
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level1-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local game
        run: python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/ascension-server.log 2>&1 &
      - name: Run interaction probe
        run: node tests/level1-click-probe.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascension-level1-click-probe
          path: level1-evidence/
