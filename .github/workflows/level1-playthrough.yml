name: Level 1 real mouse playthrough
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level1-playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start game
        run: python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/ascension-server.log 2>&1 &
      - name: Exercise Level 1 with real clicks
        run: node tests/level1-real-playthrough.cjs
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level1-playthrough-evidence
          path: level1-play-evidence/
          if-no-files-found: warn
