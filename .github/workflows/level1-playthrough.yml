name: Level 1 actual playthrough
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level1-playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start game
        run: python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/ascension-server.log 2>&1 &
      - name: Inspect actual Level 1 crank hit regions
        run: node tests/level1-handle-diagnostic.cjs
      - name: Solve Level 1 through clicks
        run: node tests/level1-playthrough.cjs
      - name: Archive gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level1-playthrough-evidence
          path: playthrough-evidence/
