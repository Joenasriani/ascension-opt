name: Verify repository

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  static-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run repository verifier
        run: |
          bash verify-repo.sh
          python3 verify-geometry.py
