name: ASCENSION Android emulator smoke test
on:
  push:
    branches: [release/android-play-2026-11]
    paths: ['.github/workflows/android-device-smoke.yml', 'android/emulator-smoke.sh', 'android/patch-runtime-for-android.py', 'android/prepare-local-css.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare application assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp -R assets music icons android/app/src/main/assets/
          sed -i '/qa-level-select.js/d' android/app/src/main/assets/index.html
          python3 android/patch-runtime-for-android.py
          bash android/prepare-local-css.sh
      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -cores 2 -memory 2048 -no-boot-anim
          script: bash android/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascension-android-emulator-evidence
          path: |
            android-evidence/
          if-no-files-found: warn
